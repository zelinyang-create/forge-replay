[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-replay"
version = "0.2.0"
description = "Durable, replay-aware coding agent harness backed by Ollama"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.11,<3",
    "pytest>=9.0.2",
]

[project.scripts]
mini-coding-agent = "mini_coding_agent:main"
forge-replay = "forge_replay.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
py-modules = ["mini_coding_agent"]
packages = ["forge_replay", "forge_replay.eval", "forge_replay.persistence", "forge_replay.runtime", "forge_replay.tools", "forge_replay.workspace"]

[tool.setuptools.package-dir]
forge_replay = "src/forge_replay"
"forge_replay.eval" = "src/forge_replay/eval"
"forge_replay.persistence" = "src/forge_replay/persistence"
"forge_replay.runtime" = "src/forge_replay/runtime"
"forge_replay.tools" = "src/forge_replay/tools"
"forge_replay.workspace" = "src/forge_replay/workspace"
